<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open the prototype homepage</title>
    <style>
      :root {
        color: #1e1e1e;
        background: #f6f7f7;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(420px, calc(100vw - 48px));
        padding: 28px;
        background: #fff;
        border: 1px solid #dcdcde;
        border-radius: 4px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.3;
      }

      p {
        margin: 0 0 18px;
        color: #50575e;
        font-size: 14px;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 14px;
        color: #fff;
        background: #2271b1;
        border-radius: 2px;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
      }

      a:hover,
      a:focus {
        background: #135e96;
      }

      code {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open the prototype homepage</h1>
      <p>
        This static preview needs to start from its base <code>index.html</code>
        page. Open the prototype homepage, then navigate from inside the app.
      </p>
      <a href="/rsm-editor-prototype/">Open prototype homepage</a>
    </main>
  </body>
</html>
